<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing accent ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#accentGrad)" stroke-width="12" opacity="0.8" stroke-dasharray="16 8"/>

  <!-- Gauge Arc -->
  <path d="M 130 330 A 150 150 0 1 1 382 330" fill="none" stroke="#334155" stroke-width="24" stroke-linecap="round"/>
  <path d="M 130 330 A 150 150 0 1 1 310 135" fill="none" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Gauge tick marks -->
  <circle cx="256" cy="106" r="6" fill="#10b981"/>
  <circle cx="150" cy="212" r="6" fill="#10b981"/>
  <circle cx="362" cy="212" r="6" fill="#64748b"/>

  <!-- Center Hub -->
  <circle cx="256" cy="256" r="32" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="8"/>
  <circle cx="256" cy="256" r="14" fill="#10b981"/>

  <!-- Needle -->
  <polygon points="256,236 320,170 256,276" fill="#38bdf8"/>

  <!-- Bike symbol below needle -->
  <g transform="translate(156, 320) scale(0.4)" stroke="#f8fafc" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Back wheel -->
    <circle cx="70" cy="130" r="50" stroke="#10b981" stroke-width="18"/>
    <!-- Front wheel -->
    <circle cx="430" cy="130" r="50" stroke="#10b981" stroke-width="18"/>
    <!-- Frame -->
    <path d="M 70 130 L 190 130 L 290 60 L 160 60 Z"/>
    <path d="M 190 130 L 260 20"/>
    <path d="M 290 60 L 430 130"/>
    <!-- Handlebars -->
    <path d="M 400 30 L 430 40 L 450 30"/>
    <!-- Seat -->
    <path d="M 230 20 L 280 20"/>
  </g>

  <!-- App Title / Subtitle Text -->
  <text x="256" y="440" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="4">BIKE TRACKER</text>
</svg>
